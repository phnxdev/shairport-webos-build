name: Build Shairport Sync ARMEL for webOS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable ARM emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Download Shairport Sync 3.3.9
        run: |
          curl -L https://github.com/mikebrady/shairport-sync/archive/refs/tags/3.3.9.tar.gz -o shairport-sync-3.3.9.tar.gz

      - name: Create build script
        run: |
          cat > build-arm.sh <<'EOF'
          #!/bin/sh
          set -eux

          cat > /etc/apt/sources.list <<'SOURCES'
          deb [trusted=yes] http://archive.debian.org/debian wheezy main
          deb [trusted=yes] http://archive.debian.org/debian-security wheezy/updates main
          SOURCES

          cat > /etc/apt/apt.conf.d/99archive <<'APTCONF'
          Acquire::Check-Valid-Until "false";
          Acquire::AllowInsecureRepositories "true";
          APT::Get::AllowUnauthenticated "true";
          APTCONF

          apt-get update

          apt-get install -y --force-yes \
            build-essential \
            autoconf \
            automake \
            libtool \
            pkg-config \
            libpulse-dev \
            libconfig-dev \
            libpopt-dev \
            libdaemon-dev \
            libssl-dev

          tar -xzf /src/shairport-sync-3.3.9.tar.gz
          cd shairport-sync-3.3.9

          autoreconf -fi

          ./configure \
            --with-pa \
            --with-tinysvcmdns \
            --with-ssl=openssl \
            --with-metadata \
            --without-alsa \
            --sysconfdir=/etc

          make -j2

          echo "=== VERSION ==="
          ./shairport-sync -V

          echo "=== ELF INTERPRETER ==="
          readelf -l ./shairport-sync | grep interpreter || true

          echo "=== LIBRARIES ==="
          ldd ./shairport-sync || true

          mkdir -p /out
          cp ./shairport-sync /out/shairport-sync-webos-armel
          EOF

          chmod +x build-arm.sh

      - name: Build ARMEL
        run: |
          mkdir -p output

          docker run --rm \
            --platform linux/arm/v5 \
            -v "$PWD:/src" \
            -v "$PWD/output:/out" \
            arm32v5/debian:wheezy \
            /src/build-arm.sh

      - name: Inspect result
        run: |
          ls -lah output
          file output/shairport-sync-webos-armel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shairport-sync-webos-armel
          path: output/shairport-sync-webos-armel
